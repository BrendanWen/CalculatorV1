<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="Calculator.js"></script>
    <title>Calculator</title>
</head>
<body>
    <div>
        <h1>Calculator</h1>
        <div>
            <span>Previous Value: </span>
            <input type="text" id="previousValue">
        </div>
        <div>
            <span>Main Output: </span>
            <input type="text" id="result">
        </div>
        <br>
        <button id="buttonOne" value=1 onClick="printNumber(value)">1</button>
        <button id="buttonTwo" value=2 onClick="printNumber(value)">2</button>
        <button id="buttonThree" value=3 onClick="printNumber(value)">3</button>
        <button id="buttonFour" value=4 onClick="printNumber(value)">4</button>
        <button id="buttonFive" value=5 onClick="printNumber(value)">5</button>
        <button id="buttonSix" value=6 onClick="printNumber(value)">6</button>
        <button id="buttonSeven" value=7 onClick="printNumber(value)">7</button>
        <button id="buttonEight" value=8 onClick="printNumber(value)">8</button>
        <button id="buttonNine" value=9 onClick="printNumber(value)">9</button>
        <button id="buttonZero" value=0 onClick="printNumber(value)">0</button>
        <br>
        <button id="buttonDecimal" value=. onClick="decimal(value)">.</button>
        <button id="buttonPercent" value=% onClick="percent(value)">%</button>
        <button id="buttonPercent" value=( onClick="bracket(value)">(</button>
        <br>
        <button id="buttonPlus" value=+ onClick="operator(value)">+</button>
        <button id="buttonMinus" value=- onClick="operator(value)">-</button>
        <button id="buttonSlash" value=* onClick="operator(value)">*</button>
        <button id="buttonStar" value=/ onClick="operator(value)">/</button>
        <br>
        <button id="buttonEqual" onClick="equals()">=</button>
        <button id="buttonDelete" onClick="backtrack()">Del</button>
        <button id="buttonClear" onClick="clearInput()">Clear</button>
    </div>
</body>
</html>
